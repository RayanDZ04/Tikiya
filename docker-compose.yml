services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tikiya
      POSTGRES_USER: tikiya
      POSTGRES_PASSWORD: tikiya
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./back/tikiya_api
      dockerfile: Dockerfile
    env_file:
      - ./back/tikiya_api/.env
    environment:
      DATABASE_URL: postgres://tikiya:tikiya@db:5432/tikiya
      PORT: 8080
      ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      - db
    ports:
      - "8080:8080"

  app_mobile_web:
    build:
      context: ./App_mobile
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"

  app_organisateur_web:
    build:
      context: ./App_mobile_organisateur
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3001:80"

  android_build_mobile:
    build:
      context: ./App_mobile
      dockerfile: Dockerfile.android
    volumes:
      - ./App_mobile/build:/app/build
      - ./App_mobile:/app
      - flutter_pub_cache:/root/.pub-cache
      - gradle_cache:/root/.gradle

  android_build_organisateur:
    build:
      context: ./App_mobile_organisateur
      dockerfile: Dockerfile.android
    volumes:
      - ./App_mobile_organisateur/build:/app/build
      - ./App_mobile_organisateur:/app
      - flutter_pub_cache:/root/.pub-cache
      - gradle_cache:/root/.gradle

volumes:
  db_data:
  flutter_pub_cache:
  gradle_cache:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tikiya
      POSTGRES_USER: tikiya
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tikiya}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Pas de port host publié : seul le réseau interne Docker (db:5432) est
    # utilisé par l'API. Pour du debug local ponctuel, utiliser
    # `docker compose exec db psql -U tikiya` plutôt que d'exposer le port.

  api:
    build:
      context: ./back/tikiya_api
      dockerfile: Dockerfile
    env_file:
      - ./back/tikiya_api/.env
    environment:
      DATABASE_URL: postgres://tikiya:${DB_PASSWORD:-tikiya}@db:5432/tikiya
      PORT: 8080
      ORIGINS: http://localhost:3000
      # 10.0.2.2 = host machine vu depuis l'émulateur Android
      PUBLIC_BASE_URL: http://10.0.2.2:8080
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./back/tikiya_api/uploads:/app/uploads

  app_mobile_web:
    build:
      context: ./App_mobile
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"

  android_build_mobile:
    build:
      context: ./App_mobile
      dockerfile: Dockerfile.android
    volumes:
      - ./App_mobile/build:/app/build
      - ./App_mobile:/app
      - flutter_pub_cache:/root/.pub-cache
      - gradle_cache:/root/.gradle

volumes:
  db_data:
  flutter_pub_cache:
  gradle_cache:

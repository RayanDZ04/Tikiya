services:
  api:
    build:
      context: ./back/tikiya_api
      dockerfile: Dockerfile.dev
    env_file:
      - ./back/tikiya_api/.env
    environment:
      DATABASE_URL: postgres://tikiya:tikiya@db:5432/tikiya
      PORT: 8080
      PUBLIC_BASE_URL: http://10.0.2.2:8080
      ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./back/tikiya_api:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - api_target:/app/target

  app_mobile_web:
    build:
      context: ./App_mobile
      dockerfile: Dockerfile.dev
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./App_mobile:/app
      - flutter_pub_cache:/root/.pub-cache

  app_organisateur_web:
    build:
      context: ./App_mobile_organisateur
      dockerfile: Dockerfile.dev
    depends_on:
      - api
    ports:
      - "3001:3001"
    volumes:
      - ./App_mobile_organisateur:/app
      - flutter_pub_cache:/root/.pub-cache

volumes:
  cargo_registry:
  cargo_git:
  api_target:
  flutter_pub_cache:

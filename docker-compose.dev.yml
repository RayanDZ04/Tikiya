services:
  api:
    build:
      context: ./back/tikiya_api
      dockerfile: Dockerfile.dev
    env_file:
      - ./back/tikiya_api/.env
    environment:
      DATABASE_URL: postgres://tikiya:${DB_PASSWORD:-tikiya}@db:5432/tikiya
      PORT: 8080
      PUBLIC_BASE_URL: http://10.0.2.2:8080
      ORIGINS: http://localhost:3000
      # Chargily Pay — clés de test (dashboard.chargily.com)
      CHARGILY_API_KEY: test_sk_Ltpa80oud4YoG2jKSXDjx8RH1OkwYxeYu0A3LcBt
      # Rate limiting — budget global élevé en dev, mais le limiteur strict sur
      # les endpoints d'auth (15 req/5 min) reste actif via Redis ci-dessous.
      RATE_LIMIT_PER_SECOND: 500
      RATE_LIMIT_BURST: 1000
      # Rate-limiting distribué (Redis) — activé en dev.
      REDIS_URL: redis://redis:6379
      # Refus des mots de passe déjà fuités (HaveIBeenPwned) — activé en dev.
      PWNED_CHECK_ENABLED: "true"
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    volumes:
      - ./back/tikiya_api:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - api_target:/app/target

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app_mobile_web:
    build:
      context: ./App_mobile
      dockerfile: Dockerfile.dev
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./App_mobile:/app
      - flutter_pub_cache:/root/.pub-cache

volumes:
  cargo_registry:
  cargo_git:
  api_target:
  flutter_pub_cache:
